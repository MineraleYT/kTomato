# SPDX-License-Identifier: GPL-3.0-or-later
name: Release Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Third-party actions and the build image are pinned to a commit / digest (the version is in
  # the comment): a moved tag cannot change what runs with --privileged or near the release token.
  # Dependabot (.github/dependabot.yml) proposes the updates.
  check:
    name: Verify release target
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -n 's/^project(kTomato VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          METAINFO_VERSION=$(grep -o -m1 '<release version="[^"]*"' data/io.github.mineraleyt.ktomato.metainfo.xml | sed 's/.*version="\([^"]*\)"/\1/')
          echo "tag: $TAG_VERSION, CMakeLists.txt: $CMAKE_VERSION, metainfo: $METAINFO_VERSION"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $CMAKE_VERSION) in CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$METAINFO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest <release> ($METAINFO_VERSION) in the metainfo"
            exit 1
          fi

  # A version tag always means a release: every tag is built, tested and published (or fails
  # visibly), whatever the tagged commit changed.
  test:
    name: Build and test
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream cmake ninja-build g++ gettext dbus-daemon \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qml6-module-org-kde-desktop \
            libqt6sql6-sqlite extra-cmake-modules \
            libkirigami-dev libkf6i18n-dev libkf6coreaddons-dev \
            libkf6colorscheme-dev libkf6notifications-dev libkf6config-dev \
            libkf6statusnotifieritem-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

  build-flatpak:
    name: Build Flatpak bundle (x86_64)
    needs: [check, test]
    runs-on: ubuntu-24.04
    container:
      # kde-6.11
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.mineraleyt.ktomato.yml
          branch: stable
          bundle: ktomato-${{ github.ref_name }}-x86_64.flatpak
          artifact-name: ktomato-${{ github.ref_name }}-x86_64.flatpak
          cache-key: ktomato-${{ github.ref_name }}-${{ github.sha }}

  publish-release:
    name: Publish GitHub release
    needs: [check, build-flatpak]
    # A manual run on a branch only builds the bundle (downloadable as an artifact);
    # releases are made from version tags alone.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Flatpak bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ktomato-${{ github.ref_name }}-x86_64.flatpak
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: release-assets/ktomato-${{ github.ref_name }}-x86_64.flatpak
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, updating Flatpak asset..."
            gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --title "kTomato $GITHUB_REF_NAME" --generate-notes
          fi
