# SPDX-License-Identifier: GPL-3.0-or-later
name: Release Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Verify release target
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.filter.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Inspect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered via workflow_dispatch, skipping doc check."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")
          echo "Changed files in ${{ github.sha }}:"
          echo "$CHANGED_FILES"

          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '^(\.github/.*\.md|README\.md|.*\.md|docs/.*|LICENSES/.*|\.gitignore)$' || true)
          if [ -z "$CODE_CHANGES" ]; then
            echo "Notice: Only documentation / markdown files were changed in this tagged commit. Skipping Flatpak release build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Code or asset changes detected. Proceeding with Flatpak release build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -n 's/^project(kTomato VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          METAINFO_VERSION=$(grep -o -m1 '<release version="[^"]*"' data/io.github.mineraleyt.ktomato.metainfo.xml | sed 's/.*version="\([^"]*\)"/\1/')
          echo "tag: $TAG_VERSION, CMakeLists.txt: $CMAKE_VERSION, metainfo: $METAINFO_VERSION"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $CMAKE_VERSION) in CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$METAINFO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest <release> ($METAINFO_VERSION) in the metainfo"
            exit 1
          fi

  test:
    name: Build and test
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream cmake ninja-build g++ gettext dbus-daemon \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qml6-module-org-kde-desktop \
            libqt6sql6-sqlite extra-cmake-modules \
            libkirigami-dev libkf6i18n-dev libkf6coreaddons-dev \
            libkf6colorscheme-dev libkf6notifications-dev libkf6config-dev \
            libkf6statusnotifieritem-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

  build-flatpak:
    name: Build Flatpak bundle (x86_64)
    needs: [check, test]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.mineraleyt.ktomato.yml
          branch: stable
          bundle: ktomato-${{ github.ref_name }}-x86_64.flatpak
          artifact-name: ktomato-${{ github.ref_name }}-x86_64.flatpak
          cache-key: ktomato-${{ github.ref_name }}-${{ github.sha }}

  publish-release:
    name: Publish GitHub release
    needs: [check, build-flatpak]
    # A manual run on a branch only builds the bundle (downloadable as an artifact);
    # releases are made from version tags alone.
    if: needs.check.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: ktomato-${{ github.ref_name }}-x86_64.flatpak
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: release-assets/ktomato-${{ github.ref_name }}-x86_64.flatpak
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, updating Flatpak asset..."
            gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --title "kTomato $GITHUB_REF_NAME" --generate-notes
          fi
